name: Flutter checks

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  linting:
    name: Lint, format & test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0   # diff-cover needs the base branch to diff changed lines

      - name: Fetch version info
        run: |
          # Extract flutter_version from .fvmrc
          FLUTTER_VERSION=$(jq -r '.flutter' .fvmrc)
          echo "FLUTTER_VERSION=${FLUTTER_VERSION}" >> "$GITHUB_ENV"
        shell: bash

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Check translation completeness
        # Fails if any lib/l10n/app_*.arb file is missing or has an empty
        # value for a key that exists in the app_en.arb template.
        run: dart run tool/check_translations.dart

      - name: Analyze Flutter
        uses: ValentinVignal/action-dart-analyze@v2.0
        with:
          emojis: false
          fail-on: info
          line-length: 120

      - name: Run unit & widget tests
        # Both run via `flutter test` (flutter_test, no device needed).
        # Live integration tests (Trakt/Sonarr/Radarr) self-skip without creds.
        run: flutter test --coverage

      - name: Coverage gate (changed lines must be tested)
        if: github.event_name == 'pull_request'
        # Diff coverage, not total: every changed line of hand-written code must be
        # covered. Total coverage is meaningless here (generated client dominates).
        # ponytail: --fail-under=80 is the knob; raise it as coverage matures.
        run: |
          pip install diff_cover
          git fetch --no-tags origin "${{ github.base_ref }}"
          diff-cover coverage/lcov.info \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=80 \
            --exclude "**/*.g.dart" "**/*.freezed.dart" "**/*.mapper.dart" \
                      "**/*.gr.dart" "**/*.swagger*.dart" \
                      "lib/jellyfin/**" "lib/src/**" "lib/l10n/generated/**"
